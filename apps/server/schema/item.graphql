enum ItemStatus {
    PENDING
    DONE
}

enum ItemType {
    ASSIGNMENT
    DEADLINE
    SOCIAL_EVENT
    TASK
}

scalar DateTime
scalar Time

interface Item {
    id: ID!
    name: String!
    startDate: DateTime!
    time: Time
    recurrence: Recurrence
    status: ItemStatus!
}

type Task implements Item {
    id: ID!
    name: String!
    startDate: DateTime!
    time: Time
    recurrence: Recurrence
    status: ItemStatus!
}